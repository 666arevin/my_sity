<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="static/image/ico_logo.png">
    <link rel="stylesheet" href="static/css/body.css">
    <link rel="stylesheet" href="static/css/nav_bar.css">
    <link rel="stylesheet" href="static/css/left_bar.css">
    <link rel="stylesheet" href="static/css/scroll_bar.css">
    <link rel="stylesheet" href="static/css/animation.css">
    <link rel="stylesheet" href="static/css/modal_window.css">
    <link rel="stylesheet" href="static/css/main_overlay.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,100..900;1,100..900&family=Sekuya&display=swap"
        rel="stylesheet">
    <title>ИИ помошник</title>
</head>

<body>
    <nav class="nav-bar">
        <div class="logo-bar">
            <img src="static/image/logo.png" alt="logo" class="site-logo">
            <h1 class="logo-name reset-logo-name">AI Agent</h1>
        </div>
        <div class="drop-down-menu">
            <div class="edging">
                <button id="drop-menu">ChatGPT</button>
                <div id='arrow-ico' class="arrow-right"></div>
            </div>
            <ul class="drop-down-list">
                <!-- Сюда JS будет добавлять li -->
                <li class="drop-menu-item">ChatGPT</li>
                <li class="drop-menu-item">DeepSeek</li>
                <li class="drop-menu-item">Gemini</li>
            </ul>
        </div>
        <div class="list-block">
            <ul class="list-bar">
                <li class="first-list-item" id="support-button">Поддержка</li>
                <li class="first-list-item" id="authorization-button">Авторизация</li>
            </ul>
        </div>
    </nav>
    <div class="wrapper">
        <aside class="left-bar">
            <div class="left-bar-funcs">
                <div class="containers">
                    <img src="static/image/new_chat.png" alt="chat" class="ico-funcs">
                    <h2 class="h2-reset h2">Новый чат</h2>
                </div>
                <div class="containers" id="chat-history-search">
                    <img src="static/image/search.png" alt="chat" class="ico-funcs">
                    <h2 class="h2-reset h2">Поиск в чатах</h2>
                </div>
            </div>
            <div class="left-bar-history">
                <ul id="chat-history">
                    <!-- Сюда JS будет добавлять li -->
                </ul>
            </div>
        </aside>
        <main class="chat-wrapper">
            <div class="chat-block">
                <span class="greeting">Я твой персональный ИИ помошник, о чем хочешь поговрить?</span>
                <form action="api/prompt" method="post" class="search-string">
                    <label for="file-input" id="label-ico">
                        <img src="static/image/add_file.png" alt="plus" width="18" height="18" class="img-ico">
                    </label>
                    <div id="user-prompt" contenteditable="true" placeholder="Введите текст..."></div>
                    <button type="button" id="send-prompt"><img src="static/image/send.png" alt="send_ico" width="22"
                            height="22" class="img-ico"></button>
                    <input type="file" id="file-input" style="display: none;" multiple>
                </form>
                <span class="service-info">AI agent может допускать ошибки, проверяйте полученную информацию.</span>
            </div>
        </main>
    </div>
    <div class="modal-overlay-blur">
        <div class="modal-overlay">
            <div class="modal-head">
                <span class="modal-text">AI AGENT<img src="static/image/logo.png" alt="logo" width="36" height="36"
                        id="logo"><br>Вы
                    можете войти или зарегистрироваться</span>
                <div class="modal-choise">
                    <button class="button-choice" id="button-log">Войти</button>
                    <button class="button-choice" id="button-reg">Зарегистрироваться</button>
                    <div class="toggle-bg"></div>
                </div>
            </div>
            <div class="modal-form">
                <form action="api/authorization" method="post" id="authorization-form">
                    <label for="login">Логин:</label>
                    <input type="text" name="login" id="login" class="input-block">
                    <label for="password">Пароль:</label>
                    <input type="password" name="password" id="password" class="input-block">
                    <label for="password-repeat" class="pasw-rep" id="label-pasw-rep">Повторите пароль:</label>
                    <input type="password" name="password-repeat" id="password-repeat" class="input-block pasw-rep">
                </form>
            </div>
            <div class="footer">
                <button type="submit" form="authorization-form" id="main-button" class="footer-button">Войти</button>
                <button id="goole-authorization" class="footer-button">Войти через гугл<img
                        src="static/image/google.png" alt="google" width="16" height="16" id="google-ico"></button>
            </div>
        </div>
    </div>
    <script src="static/js/chat_history.js"></script>
    <script src="static/js/dropdown_menu.js"></script>
    <script src="static/js/modal-window.js"></script>
    <script src="static/js/textarea.js"></script>
</body>

</html>
